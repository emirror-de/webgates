name: Release verification

on:
    push:
        tags:
            - "v*"

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
    RUSTFLAGS: -D warnings

jobs:
    release-check:
        name: Release build & tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Cache cargo/target and registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-

            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable

            - name: Toolchain info
              run: |
                  rustc --version
                  cargo --version

            - name: Format check
              run: cargo fmt --all -- --check

            - name: Clippy check (workspace)
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Feature contract check
              run: python3 ./scripts/check_feature_contract.py --check-only

            - name: Workspace doc tests
              run: cargo test --workspace --doc

            - name: Feature matrix smoke tests
              run: |
                  cargo test -p webgates --no-default-features --features codecs
                  cargo test -p webgates --no-default-features --features cookies
                  cargo test -p webgates --no-default-features --features oauth2
                  cargo test -p webgates --no-default-features --features authn
                  cargo test -p webgates --features wasm
                  cargo test -p webgates --features full

            - name: Build (release)
              run: cargo build --workspace --release

            - name: Run tests (release)
              run: cargo test --workspace --release

            - name: Install cargo-audit
              run: cargo install cargo-audit

            - name: Run cargo audit
              # Keep the same ignores as the repository advisory policy to avoid known upstream issues blocking release verification.
              run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2026-0097

            - name: Install cargo-deny
              run: cargo install cargo-deny

            - name: Run cargo deny
              run: cargo deny check
