name: CI

on:
    push:
        branches:
            - nightly
    pull_request:

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
    RUSTFLAGS: -D warnings

jobs:
    # Fast PR validation - runs quickly on every PR
    fast-pr-check:
        name: Fast PR validation
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable) with rustfmt and clippy
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: Install Python dependencies
              run: |
                  apt-get update && apt-get install -y python3-pip
                  python3 -m pip install toml

            - name: Feature contract check
              run: python3 ./scripts/check_feature_contract.py --check-only
            - name: Format check
              run: cargo fmt --all -- --check
            - name: Clippy check (workspace)
              run: cargo clippy --workspace --all-targets -- -D warnings
            - name: Unit tests (workspace)
              run: cargo test --workspace

    # Feature matrix testing - ensures all feature combinations work
    feature-matrix:
        name: Feature matrix
        needs: [fast-pr-check]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    # webgates minimal feature combinations
                    - pkg: webgates
                      features: "--no-default-features --features codecs"
                      desc: webgates-codecs-only
                    - pkg: webgates
                      features: "--no-default-features --features cookies"
                      desc: webgates-cookies-only
                    - pkg: webgates
                      features: "--no-default-features --features oauth2"
                      desc: webgates-oauth2-only
                    - pkg: webgates
                      features: "--no-default-features --features authn"
                      desc: webgates-authn-only
                    - pkg: webgates
                      features: "--features full"
                      desc: webgates-full
                    - pkg: webgates
                      features: "--features wasm"
                      desc: webgates-wasm

                    # Repository backends
                    - pkg: webgates-repositories
                      features: "--features surrealdb"
                      desc: repositories-surrealdb
                    - pkg: webgates-repositories
                      features: "--features sea-orm"
                      desc: repositories-sea-orm
                    - pkg: webgates-repositories
                      features: "--all-features"
                      desc: repositories-all-features

                    # Other core crates
                    - pkg: webgates-axum
                      features: "--all-features"
                      desc: axum-all-features
                    - pkg: webgates-sessions
                      features: ""
                      desc: sessions-default
                    - pkg: webgates-codecs
                      features: ""
                      desc: codecs-default
                    - pkg: webgates-secrets
                      features: ""
                      desc: secrets-default

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: Test ${{ matrix.desc }}
              run: cargo test -p ${{ matrix.pkg }} ${{ matrix.features }}

    # Doc tests - validate documentation examples
    doc-tests:
        name: Documentation tests
        needs: [fast-pr-check]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: Doc tests
              run: cargo test --workspace --doc

    # MSRV check
    msrv:
        name: MSRV check (1.94)
        needs: [fast-pr-check]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (1.94)
              uses: dtolnay/rust-toolchain@1.94.0
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: Check workspace compiles on MSRV
              run: cargo check --workspace

    # Security audits - run on nightly/version branches and PRs
    security:
        name: Security audit
        needs: [feature-matrix, doc-tests]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: Install cargo-audit and cargo-deny
              run: |
                  cargo install cargo-audit
                  cargo install cargo-deny
            - name: Run cargo audit
              run: cargo audit
            - name: Run cargo deny
              run: cargo deny check

    # Examples validation
    examples:
        name: Examples
        needs: [feature-matrix]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - pkg: simple-usage-example
                    - pkg: custom-roles-example
                    - pkg: permission-validation-example
                    - pkg: rate-limiting-example
                    - pkg: sea-orm-example
                    - pkg: surrealdb-example
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: Check and test ${{ matrix.pkg }}
              run: |
                  cargo check -p ${{ matrix.pkg }}
                  cargo test -p ${{ matrix.pkg }}

    # Optional quality gates - run only on nightly/version branches
    extended-checks:
        name: Extended quality checks
        if: startsWith(github.ref, 'refs/heads/version/') || github.ref == 'refs/heads/nightly'
        needs: [security]
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: Install tools
              run: |
                  cargo install cargo-semver-checks
                  cargo install cargo-tarpaulin
            - name: Semver checks
              run: cargo semver-checks check-release -p webgates --default-features
            - name: Coverage
              run: cargo tarpaulin --workspace --out Markdown
            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-markdown
                  path: tarpaulin-report.md
