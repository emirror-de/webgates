name: CI

on:
    push:
        branches:
            - nightly
            - "version/*"
    pull_request:

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
    RUSTFLAGS: -D warnings

jobs:
    fmt:
        name: Format check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable) with rustfmt
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: rustfmt --check
              run: cargo fmt --all -- --check

    clippy:
        name: Clippy (all targets)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable) with clippy
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: cargo clippy
              run: |
                  # Core crate (all features)
                  cargo clippy -p webgates --all-targets --all-features -- -D warnings
                  # Core crate (wasm only; no server deps)
                  cargo clippy -p webgates --all-targets --features wasm -- -D warnings
                  # Repository crate (all repo/backend features)
                  cargo clippy -p webgates-repositories --all-targets --all-features -- -D warnings
                  # Axum integration crate
                  cargo clippy -p webgates-axum --all-targets --all-features -- -D warnings

    feature-matrix:
        name: Feature matrix tests (per-crate, per-feature + all-features)
        needs: [clippy]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    # webgates crate: default, per-feature, and all-features
                    - pkg: webgates
                      cmd: cargo test -p webgates
                      desc: webgates-default
                    - pkg: webgates
                      cmd: cargo test -p webgates --all-features
                      desc: webgates-all-features
                    - pkg: webgates
                      cmd: cargo test -p webgates --features wasm
                      desc: webgates-wasm
                    - pkg: webgates
                      cmd: cargo test -p webgates --no-default-features --features authn
                      desc: webgates-authn
                    - pkg: webgates
                      cmd: cargo test -p webgates --no-default-features --features codecs
                      desc: webgates-codecs
                    - pkg: webgates
                      cmd: cargo test -p webgates --no-default-features --features cookies
                      desc: webgates-cookies
                    - pkg: webgates
                      cmd: cargo test -p webgates --no-default-features --features oauth2
                      desc: webgates-oauth2
                    - pkg: webgates
                      cmd: cargo test -p webgates --no-default-features --features repositories
                      desc: webgates-repositories
                    - pkg: webgates
                      cmd: cargo test -p webgates --no-default-features --features secrets
                      desc: webgates-secrets

                    - pkg: webgates
                      cmd: cargo test -p webgates --features audit-logging
                      desc: webgates-audit-logging
                    - pkg: webgates
                      cmd: cargo test -p webgates --features prometheus
                      desc: webgates-prometheus
                    - pkg: webgates
                      cmd: cargo test -p webgates --features full
                      desc: webgates-full

                    # webgates-repositories crate: default, per-feature, and all-features
                    - pkg: webgates-repositories
                      cmd: cargo test -p webgates-repositories
                      desc: repositories-default
                    - pkg: webgates-repositories
                      cmd: cargo test -p webgates-repositories --features audit-logging
                      desc: repositories-audit-logging
                    - pkg: webgates-repositories
                      cmd: cargo test -p webgates-repositories --features surrealdb
                      desc: repositories-surrealdb
                    - pkg: webgates-repositories
                      cmd: cargo test -p webgates-repositories --features sea-orm
                      desc: repositories-sea-orm

                    # webgates-axum crate: default and all-features
                    - pkg: webgates-axum
                      cmd: cargo test -p webgates-axum
                      desc: axum-default
                    - pkg: webgates-axum
                      cmd: cargo test -p webgates-axum --all-features
                      desc: axum-all-features

                    # Workspace-level checks: all-features together
                    - pkg: workspace
                      cmd: cargo test --workspace --all-features
                      desc: workspace-all-features

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: Rust version
              run: |
                  rustc --version
                  cargo --version
            - name: Run matrix item
              run: |
                  echo "Running: ${{ matrix.desc }}"
                  echo "Command: ${{ matrix.cmd }}"
                  eval "${{ matrix.cmd }}"

    test-core:
        name: Core test matrix
        needs: [fmt, clippy]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: default_features
                      cmd: cargo test --workspace

                    - name: wasm
                      cmd: cargo test -p webgates --features wasm

                    - name: surrealdb
                      cmd: cargo test -p webgates-repositories --features surrealdb
                    - name: sea_orm
                      cmd: cargo test -p webgates-repositories --features sea-orm
                    - name: all_backend_features
                      cmd: cargo test -p webgates-repositories --features surrealdb,sea-orm
                    - name: axum_default
                      cmd: cargo test -p webgates-axum
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: Rust version
              run: |
                  rustc --version
                  cargo --version
            - name: Run ${{ matrix.name }}
              run: ${{ matrix.cmd }}

    test-integration:
        name: Integration tests
        needs: [test-core]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: cargo test --test '*'
              run: cargo test --workspace --test '*'

    test-doc:
        name: Doc tests
        needs: [test-core]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: cargo test --doc
              run: cargo test --workspace --doc

    msrv:
        name: MSRV check (1.88)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (1.88)
              uses: dtolnay/rust-toolchain@1.88.0
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: rustc/cargo version
              run: |
                  rustc --version
                  cargo --version
            - name: cargo check (all features)
              run: cargo check --workspace
            - name: cargo test (all features)
              run: cargo test --workspace

    stable-build:
        name: Stable build/test (allow failure)
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: cargo check (all features)
              run: cargo check --workspace
            - name: cargo test (all features)
              run: cargo test --workspace

    benches:
        name: Benches (allowed to fail)
        if: startsWith(github.ref, 'refs/heads/version/') || github.ref == 'refs/heads/nightly' || github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: cargo test --benches
              run: cargo test --workspace --benches

    audit:
        name: cargo-audit
        needs: [test-integration, test-doc]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: Install cargo-audit
              run: cargo install cargo-audit
            - name: Run cargo audit
              run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0436

    deny:
        name: cargo-deny
        needs: [test-integration, test-doc]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: Install cargo-deny
              run: cargo install cargo-deny
            - name: Run cargo deny
              run: cargo deny check

    semver-checks:
        name: cargo-semver-checks (feature matrix)
        if: startsWith(github.ref, 'refs/heads/version/') || github.ref == 'refs/heads/nightly' || github.event_name == 'pull_request'
        needs: [test-integration, test-doc]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: default
                      args: "--default-features"

                    - name: audit-logging
                      args: "--only-explicit-features --features default,audit-logging"
                    - name: prometheus
                      args: "--only-explicit-features --features default,prometheus"
                    - name: wasm
                      args: "--only-explicit-features --features wasm"
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: Install cargo-semver-checks
              run: cargo install cargo-semver-checks
            - name: Run cargo semver-checks (${{ matrix.name }})
              run: cargo semver-checks check-release -p webgates ${{ matrix.args }}

    examples:
        name: Examples matrix
        needs: [test-integration, test-doc]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - pkg: simple-usage-example
                      all_features: true
                    - pkg: custom-roles-example
                      all_features: true
                    - pkg: distributed
                      all_features: true
                    - pkg: permission-validation-example
                      all_features: true
                    - pkg: rate-limiting-example
                      all_features: true
                    - pkg: sea-orm-example
                      all_features: false
                    - pkg: surrealdb-example
                      all_features: false
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: cargo check -p ${{ matrix.pkg }}
              run: cargo check -p ${{ matrix.pkg }}
            - name: cargo test -p ${{ matrix.pkg }}
              shell: bash
              run: |
                  if [ "${{ matrix.all_features }}" = "true" ]; then
                    cargo test -p "${{ matrix.pkg }}"
                  else
                    cargo test -p "${{ matrix.pkg }}"
                  fi

    coverage:
        name: Coverage (tarpaulin)
        if: startsWith(github.ref, 'refs/heads/version/') || github.ref == 'refs/heads/nightly'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable
            - name: Cache cargo/target
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-
            - name: Install tarpaulin
              run: cargo install cargo-tarpaulin
            - name: Run tarpaulin (markdown)
              run: cargo tarpaulin --workspace --out Markdown
            - name: Upload tarpaulin-report.md
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-markdown
                  path: tarpaulin-report.md
