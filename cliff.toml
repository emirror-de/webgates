# Configuration file for git-cliff
# Learn more: https://git-cliff.org/docs/configuration

[changelog]
# Header template for the changelog
header = """
# 📜 Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

---

"""

# Body template for each version
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
    {% set group_name = group | replace(from="🛳  ", to="") | replace(from="🐞 ", to="") | replace(from="📄 ", to="") | replace(from="🏎  ", to="") | replace(from="🏗  ", to="") | replace(from="⚒ ", to="") | replace(from="🚲 ", to="") %}\
    ### {{ group }}
    {% for commit in commits %}\
        {% if commit.breaking %}\
    - **💥 BREAKING CHANGE:** {{ commit.message | upper_first }}{% if commit.scope %} *({{ commit.scope }})* {% endif %} [{{ commit.id | truncate(length=7, end="") }}](https://github.com/emirror-de/webgates/commit/{{ commit.id }})

        {% else %}\
    - {{ commit.message | upper_first }}{% if commit.scope %} *({{ commit.scope }})* {% endif %} [{{ commit.id | truncate(length=7, end="") }}](https://github.com/emirror-de/webgates/commit/{{ commit.id }})

        {% endif %}\
    {% endfor %}

{% endfor %}\
"""

# Footer template
footer = """
---

<!-- generated by git-cliff -->
"""

# Remove excess newlines and whitespace
trim = true

[git]
# Parse conventional commits
conventional_commits = true
# Include non-conventional commits too
filter_unconventional = false
# Split commits by line
split_commits = false

# Define how commits are parsed and categorized
commit_parsers = [
    # Features
    { message = "^feat", group = "🛳 Features"},
    { message = "^feature", group = "🛳 Features"},

    # Bug fixes
    { message = "^fix", group = "🐞 Bug Fixes"},
    { message = "^bug", group = "🐞 Bug Fixes"},
    { message = "^hotfix", group = "🐞 Bug Fixes"},

    # Performance improvements
    { message = "^perf", group = "🏎 Performance"},
    { message = "^performance", group = "🏎 Performance"},

    # Refactoring
    { message = "^refactor", group = "🏗 Refactoring"},
    { message = "^refact", group = "🏗 Refactoring"},

    # Documentation
    { message = "^docs", group = "📄 Documentation"},
    { message = "^doc", group = "📄 Documentation"},

    # Tests
    { message = "^test", group = "⚒ Testing"},
    { message = "^tests", group = "⚒ Testing"},

    # Build system and dependencies
    { message = "^build", group = "🔧 Build System"},
    { message = "^deps", group = "📦 Dependencies"},
    { message = "^dep", group = "📦 Dependencies"},

    # CI/CD
    { message = "^ci", group = "👷 CI/CD"},

    # Style changes (formatting, missing semicolons, etc.)
    { message = "^style", group = "🎨 Style"},
    { message = "^fmt", group = "🎨 Style"},
    { message = "^format", group = "🎨 Style"},

    # Miscellaneous tasks
    { message = "^chore", group = "🚲 Miscellaneous"},
    { message = "^misc", group = "🚲 Miscellaneous"},

    # Security fixes
    { message = "^security", group = "🔒 Security"},
    { message = "^sec", group = "🔒 Security"},

    # Reverts
    { message = "^revert", group = "⏪ Reverts"},

    # Catch-all for any other commits
    { message = ".*", group = "📝 Other Changes"},

    # Skip certain commits
    { message = "^wip", skip = true},
    { message = "^work in progress", skip = true},
    { message = "^tmp", skip = true},
    { message = "^temp", skip = true},
]

# Protect breaking changes from being skipped
protect_breaking_commits = true

# Filter commits based on patterns
filter_commits = false

# Sort commits topologically
topo_order = false

# Sort commits chronologically
sort_commits = "newest"

# Link parsers for issue/PR references
link_parsers = [
    # GitHub issues
    { pattern = "#(\\d+)", href = "https://github.com/emirror-de/webgates/issues/$1", text = "#$1"},
    # GitHub pull requests
    { pattern = "PR#(\\d+)", href = "https://github.com/emirror-de/webgates/pull/$1", text = "PR#$1"},
]

# Additional commit preprocessing
commit_preprocessors = [
    # Remove conventional commit prefixes from the final message
    { pattern = '^\w+(\(.+\))?\s*:\s*(.*)$', replace = "$2"},
    # Clean up common patterns
    { pattern = '\s+', replace = " "},
]

# Tags configuration
git.tag_pattern = "v[0-9].*"

# Bump configuration for semantic versioning
[bump]
# Features bump minor version
features_always_bump_minor = true
# Breaking changes bump major version
breaking_always_bump_major = true
