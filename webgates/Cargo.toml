[package]
name = "webgates"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Lewin Probst <info@emirror.de>"]
description = "Core domain models and services for webgates authentication and authorization."
homepage = "https://github.com/emirror-de/webgates"
repository = "https://github.com/emirror-de/webgates"
readme = "README.md"
documentation = "https://docs.rs/webgates"
keywords = ["auth", "jwt", "rbac"]
categories = ["authentication"]

[package.metadata.docs.rs]
features = [
    "insecure-fast-hash",
    "audit-logging",
    "prometheus",
]

[features]
default = ["server"]
wasm = ["uuid/js"]
server = [
    "dep:argon2",
    "dep:chrono",
    "dep:cookie",
    "dep:rand",
    "dep:serde_json",
    "dep:serde_with",
    "dep:subtle",
    "tokio/rt-multi-thread",
    "dep:tracing",
]
insecure-fast-hash = []
audit-logging = ["dep:tracing"]
prometheus = ["audit-logging", "dep:prometheus"]

[dependencies]
const-crypto = { workspace = true }
argon2 = { workspace = true, features = ["std"], optional = true }
chrono = { workspace = true, optional = true }
cookie = { workspace = true, optional = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true, optional = true }
roaring = { workspace = true, features = ["serde"] }

serde = { workspace = true }
serde_json = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }
strum = { workspace = true }
subtle = { workspace = true, optional = true }

thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde", "v7", "js"] }

[dev-dependencies]

webgates-repositories = { path = "../webgates-repositories", features = ["repo-seaorm", "repo-surrealdb"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-test = "0.4.4"
uuid = "1"

[profile.dev]
debug = false
