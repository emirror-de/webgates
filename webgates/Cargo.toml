[package]
name = "webgates"
version = "1.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Lewin Probst <info@emirror.de>"]
description = "Application-facing composition crate for webgates authentication and authorization."
homepage = "https://github.com/emirror-de/webgates"
repository = "https://github.com/emirror-de/webgates"
readme = "README.md"
documentation = "https://docs.rs/webgates"
keywords = ["auth", "jwt", "rbac"]
categories = ["authentication"]

[package.metadata.docs.rs]
features = ["authn", "cookies", "oauth2", "audit-logging", "prometheus", "secrets"]

[features]
default = []
wasm = ["uuid/js"]
codecs = [
    "dep:chrono",
    "dep:serde_json",
    "dep:serde_with",
    "dep:webgates-codecs",
]
secrets = [
    "dep:rand",
    "dep:webgates-secrets",
]
repositories = ["dep:webgates-repositories"]
sessions = [
    "codecs",
    "repositories",
    "secrets",
    "dep:webgates-sessions",
]
cookies = ["codecs", "dep:cookie"]
oauth2 = [
    "codecs",
    "cookies",
    "dep:oauth2",
    "repositories",
]
authn = [
    "codecs",
    "repositories",
    "secrets",
    "tokio/rt-multi-thread",
    "dep:tracing",
]
audit-logging = ["dep:tracing"]
prometheus = ["audit-logging", "dep:prometheus"]
full = [
    "authn",
    "audit-logging",
    "codecs",
    "cookies",
    "oauth2",
    "prometheus",
    "repositories",
    "secrets",
    "sessions",
]

[dependencies]
chrono = { workspace = true, optional = true }
const-crypto = "0.3"
cookie = { workspace = true, optional = true }
jsonwebtoken = { workspace = true }
oauth2 = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
roaring = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
serde_with = { version = "3", optional = true }
strum = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde", "v7", "js"] }
webgates-core = { path = "../webgates-core", version = "1.0.0" }
webgates-codecs = { path = "../webgates-codecs", version = "1.0.0", optional = true }
webgates-repositories = { path = "../webgates-repositories", version = "1.0.0", optional = true }
webgates-secrets = { path = "../webgates-secrets", version = "1.0.0", optional = true }
webgates-sessions = { path = "../webgates-sessions", version = "1.0.0", optional = true }

[dev-dependencies]
surrealdb = { version = "3", features = ["kv-mem"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-test = "0.4.4"
uuid = "1"
webgates-repositories = { path = "../webgates-repositories", version = "1.0.0", features = ["sea-orm", "surrealdb"] }
