[package]
name = "custom-roles-example"
version = "1.1.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata.release]
release = false

[dependencies]
axum = "0.8"
chrono = { workspace = true }
dotenvy = { workspace = true }
serde = { workspace = true }
sea-orm = { workspace = true, features = ["runtime-tokio", "sqlx-sqlite"] }
strum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
webgates = { path = "../../webgates" }
webgates-axum = { path = "../../webgates-axum" }
webgates-repositories = { path = "../../webgates-repositories", features = ["sea-orm"] }
