[package]
name = "oauth2-github"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
dotenvy = "0.15"
oauth2 = { workspace = true }
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["std", "env-filter"] }
uuid.workspace = true
webgates = { path = "../../webgates" }
webgates-axum = { path = "../../webgates-axum" }
webgates-repositories = { path = "../../webgates-repositories" }
