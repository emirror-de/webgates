[package]
name = "distributed"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata.release]
release = false

[[bin]]
name = "auth_node"
path = "src/bin/auth_node.rs"

[[bin]]
name = "consumer_node"
path = "src/bin/consumer_node.rs"

[dependencies]
axum = "0.8"
chrono = { workspace = true }
dotenvy = { workspace = true }
roaring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
webgates = { path = "../../webgates" }
webgates-axum = { path = "../../webgates-axum" }
webgates-codecs = { path = "../../webgates-codecs" }
webgates-repositories = { path = "../../webgates-repositories" }
