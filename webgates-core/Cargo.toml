[package]
name = "webgates-core"
version = "1.1.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Lewin Probst <info@emirror.de>"]
description = "Core domain types, permission system, and authorization building blocks for webgates."
homepage = "https://github.com/emirror-de/webgates"
repository = "https://github.com/emirror-de/webgates"
readme = "README.md"
documentation = "https://docs.rs/webgates-core"
keywords = ["auth", "authorization", "rbac"]
categories = ["authentication"]

[dependencies]
const-crypto = "0.3"
roaring = { workspace = true, features = ["serde"] }
serde = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v7"] }

[features]
default = []

[target.'cfg(target_family = "wasm")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
serde_json = { workspace = true }
tokio-test = "0.4.4"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
