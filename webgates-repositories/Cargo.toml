[package]
name = "webgates-repositories"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Lewin Probst <info@emirror.de>"]
description = "Repository implementations for the webgates authentication and authorization domain."
homepage = "https://github.com/emirror-de/webgates"
repository = "https://github.com/emirror-de/webgates"
readme = "README.md"
documentation = "https://docs.rs/webgates-repositories"
keywords = ["auth", "jwt", "rbac"]
categories = ["authentication"]

[package.metadata.docs.rs]
features = ["audit-logging", "surrealdb", "sea-orm"]

[features]
default = []
audit-logging = []
surrealdb = [
    "dep:serde_json",
    "dep:surrealdb",
    "dep:surrealdb-types",
]
sea-orm = [
    "dep:sea-orm",
    "dep:sea-query",
    "dep:serde_json",
]

[dependencies]

sea-orm = { workspace = true, optional = true }
sea-query = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
strum = { workspace = true }
subtle = { workspace = true }
surrealdb = { workspace = true, optional = true }
surrealdb-types = { version = "3", optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v7", "js"] }
webgates-core = { path = "../webgates-core" }
webgates-secrets = { path = "../webgates-secrets" }

[dev-dependencies]
tokio-test = "0.4.4"
