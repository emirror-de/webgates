[package]
name = "webgates-axum"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
authors = ["Lewin Probst <info@emirror.de>"]
description = "Axum integration layer for the webgates authentication and authorization core."
homepage = "https://github.com/emirror-de/webgates"
repository = "https://github.com/emirror-de/webgates"
readme = "README.md"
documentation = "https://docs.rs/webgates-axum"
keywords = ["axum", "auth", "jwt", "oauth2", "rbac"]
categories = ["authentication", "web-programming::http-server"]

[features]
default = []
audit-logging = ["webgates/audit-logging"]
prometheus = ["audit-logging", "webgates/prometheus", "dep:prometheus"]

[dependencies]
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
chrono = { workspace = true }
cookie = { workspace = true }
http = "1"
jsonwebtoken = { workspace = true }
oauth2 = { workspace = true }
prometheus = { workspace = true, optional = true }
rand = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["limit", "util", "timeout", "buffer", "load-shed"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["serde", "v7"] }
webgates = { path = "../webgates", features = ["authn", "codecs", "cookies", "oauth2", "repositories", "secrets", "sessions"] }
webgates-codecs = { path = "../webgates-codecs" }
webgates-repositories = { path = "../webgates-repositories", features = ["sessions"] }

[dev-dependencies]
axum = "0.8"
tokio-test = "0.4.4"
webgates-repositories = { path = "../webgates-repositories", features = ["sessions"] }
